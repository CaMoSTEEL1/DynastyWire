[package]
name = "dynastywire"
version = "0.1.0"
description = "Dynasty Wire — standalone CFB27 dynasty media companion"
edition = "2021"

[lib]
name = "dynastywire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
save-parser = { path = "../save-parser" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22.1"
tauri-plugin-process = "2.3.1"
minisign-verify = "0.2.5"

# Already in the tree via Tauri; named here so the WebView2 recovery in lib.rs can ask the
# loader directly whether it can find a runtime, instead of guessing from the registry.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows-core = "0.61"

# Live game reading: capture the game window (GDI) and read the score bar with the OCR engine
# built into Windows. No memory reads and no injection - the same surface OBS uses - which is
# what makes it safe to run beside EA's anti-cheat. See src/live.rs.
[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Media_Ocr",
  "Globalization",
  "Graphics_Imaging",
  "Storage_Streams",
  "Foundation_Collections",
]
