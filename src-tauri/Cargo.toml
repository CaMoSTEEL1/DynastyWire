[package]
name = "dynastywire"
version = "0.1.0"
description = "Dynasty Wire — standalone CFB27 dynasty media companion"
edition = "2021"

[lib]
name = "dynastywire_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
save-parser = { path = "../save-parser" }
