name = "dynastywire-forum"
main = "src/index.js"
compatibility_date = "2025-01-01"

# The bundles and the directory index live here. R2 is the right store for this: the payload
# is read whole (~300 KB for a multi-season dynasty) and R2 charges nothing for egress, which
# is what stops one popular dynasty from becoming a bill.
[[r2_buckets]]
binding = "BUNDLES"
bucket_name = "dynastywire-forum"
preview_bucket_name = "dynastywire-forum-preview"
